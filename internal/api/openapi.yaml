openapi: 3.1.0
info:
  title: AMDL Backend API
  version: 2.0.0
  description: |
    Apple Music download jobs and wrapper account management API. The URL prefix
    stays /api/v1; info.version is the version of this contract.

    Errors: every non-2xx JSON response is an ErrorResponse,
    `{"error": {"code", "message", "details"?}}`. Switch on `code` (the
    ErrorCode enum); `message` is for humans and may change; `details` is
    code-specific. The one exception is GET /api/v1/health, whose 503 body is a
    HealthResponse. A path under /api/ that does not exist answers 404
    route_not_found; a path that exists with other methods answers 405
    method_not_allowed with an Allow header. The log routes answer 503
    feature_unavailable when the process keeps no log history.

    Streams are Server-Sent Events. Each resumes from the Last-Event-ID header or
    the `cursor` query parameter; the header wins when both are set, and a
    malformed cursor is 400 invalid_request. Every stream sends a `: keepalive`
    comment every 15 seconds and the X-Accel-Buffering: no header.
servers:
  - url: /
tags:
  - name: System
  - name: Wrapper
  - name: Quality
  - name: Downloads
  - name: Search
paths:
  /api/v1/health:
    get:
      tags: [System]
      summary: Backend health check
      operationId: getHealth
      responses:
        '200':
          description: The backend is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: The local database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/system:
    get:
      tags: [System]
      summary: Build, runtime capacity and host resources
      description: >-
        Reports the running build (version, commit and build date stamped at
        build time; version is dev and the other two come from the VCS stamp or
        are empty for a build without them), the Go runtime, process start and
        uptime, the simulate flag, the job workers and queue, the process-wide
        pool sizes, the external tools, and the free space of
        download.downloads_dir and download.temp_dir. It never returns a secret.
      operationId: getSystem
      responses:
        '200':
          description: The system snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /api/v1/stats:
    get:
      tags: [System]
      summary: Download activity statistics
      description: >-
        Totals and the codec mix over every retained job, plus a per-day series
        and hook outcomes for the last `days` UTC calendar days, today included.
        Only jobs that still exist count: deleting a job removes its items and
        events. Results are cached for 30 seconds per `days` value;
        generated_at says when a result was computed.
      operationId: getStats
      parameters:
        - $ref: '#/components/parameters/StatsDays'
      responses:
        '200':
          description: The statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '400':
          description: invalid_request; days is not an integer between 1 and 90.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/logs:
    get:
      tags: [System]
      summary: Query process logs
      description: >-
        Queries the recent structured logs retained by logging.buffer_size, returned
        in ascending time order. The first query returns the most recent `limit`
        entries; follow-up queries with `cursor` page onward from that sequence,
        and next_cursor can be passed as the next query's cursor. oldest_sequence
        is the oldest sequence number still retained; truncated means entries
        between `cursor` and it have already been evicted from the in-memory ring.
        Sensitive attributes are redacted uniformly before they enter the buffer or
        any external output.
      operationId: listLogs
      parameters:
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogComponent'
        - $ref: '#/components/parameters/LogRequestID'
        - $ref: '#/components/parameters/LogJobID'
        - $ref: '#/components/parameters/LogQuery'
        - $ref: '#/components/parameters/LogSince'
        - $ref: '#/components/parameters/LogUntil'
        - $ref: '#/components/parameters/LogCursor'
        - $ref: '#/components/parameters/LogLimit'
      responses:
        '200':
          description: Matching logs and the cursor for the next query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: >-
            feature_unavailable; logging.buffer_size is 0, so no log history is
            retained, or the log buffer is not wired into this process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/logs/stream:
    get:
      tags: [System]
      summary: Stream process logs live
      description: >-
        SSE log stream. Matching entries still in memory after the cursor are
        replayed first, then new entries keep being pushed; every event is named log
        and its SSE id equals the log sequence. The cursor is the Last-Event-ID
        header or the `cursor` query parameter (the header wins). With a cursor,
        every matching entry still in memory is replayed; without one, the most
        recent entries are replayed up to `limit`. The server sends a keepalive
        comment every 15 seconds; if the client keeps reading too slowly the
        connection is closed, and the client should reconnect with the last id it
        received to catch up.
      operationId: streamLogs
      parameters:
        - $ref: '#/components/parameters/LogLevel'
        - $ref: '#/components/parameters/LogComponent'
        - $ref: '#/components/parameters/LogRequestID'
        - $ref: '#/components/parameters/LogJobID'
        - $ref: '#/components/parameters/LogQuery'
        - $ref: '#/components/parameters/LogSince'
        - $ref: '#/components/parameters/LogUntil'
        - $ref: '#/components/parameters/LogCursor'
        - $ref: '#/components/parameters/LogLimit'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          description: text/event-stream; data is LogEntry JSON.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: >-
            feature_unavailable; logging.buffer_size is 0, so no log history is
            retained, or the log buffer is not wired into this process.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/config:
    get:
      tags: [System]
      summary: Read the current runtime configuration (mutable fields only)
      description: >-
        Returns the runtime-mutable part of the effective configuration: the download
        section (except max_running_jobs and max_parallel_downloads),
        logging.level/access_log, the simulate section, the library_sync section, and
        catalog.album_track_url_mode/media_user_token/motion_artwork_enabled.
        Startup-only fields (server, database, the other logging fields, wrapper,
        tools, the other catalog fields) are not returned — they cannot be changed
        through this API; edit the startup configuration configs/config.yaml and
        restart instead.

        GET is a pure read of the in-memory configuration and has no side effects:
        it does not re-read configs/config.yaml. A hand edit of the file takes
        effect through POST /api/v1/config/reload; startup-only fields
        still require a restart.
      operationId: getConfig
      responses:
        '200':
          description: The current runtime-mutable configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [System]
      summary: Update the runtime configuration
      description: >-
        The request body overrides the current runtime configuration with merge
        semantics: omitted fields keep their current values, and fields that are
        present (including whole sections) are replaced. The merged result must pass
        the same full validation as the configuration file.

        Only the fields returned by GET can be changed: the download section (except
        max_running_jobs and max_parallel_downloads), logging.level/access_log, the
        simulate section, the library_sync section, and
        catalog.album_track_url_mode/media_user_token/motion_artwork_enabled.
        Every other field is consumed only at process startup, and a request that
        changes one is rejected with 422 config_key_not_mutable — edit the startup
        configuration configs/config.yaml and restart instead. An unknown field is
        400 invalid_request.

        Changes take effect immediately for new requests and newly started jobs
        (running jobs keep the configuration snapshot taken when they started), and
        the complete configuration, startup fields included, is written back to
        configs/config.yaml, so it still applies after a restart. That file is
        managed by the backend (rewritten in full on every PUT, comments are not
        kept); the fully commented field documentation is
        configs/config.example.yaml, which serves as the template for config.yaml
        on first start.

        PUT re-reads configs/config.yaml under the same lock before it applies the
        patch, so a hand edit made since the last reload is kept rather than
        overwritten. When that file no longer validates, PUT answers 422
        invalid_config and changes nothing; fix the file first. Frontends should
        still build the body from a fresh GET and send only the fields the user
        changed.
      operationId: updateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeConfig'
      responses:
        '200':
          description: The updated runtime configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '400':
          description: >-
            invalid_json: the body is not well-formed JSON; invalid_request: it
            contains unknown fields or values of the wrong type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '422':
          description: >-
            config_key_not_mutable: the request changes a startup-only field
            (details.keys lists them); invalid_config: the merged result fails configuration validation, or
            the config file on disk no longer validates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/config/reload:
    post:
      tags: [System]
      summary: Re-read the configuration file
      description: >-
        Re-reads configs/config.yaml and applies its runtime-mutable fields; the
        logging level takes effect at once. Startup-only fields keep their
        in-memory values until a restart. The response has the shape of GET
        /api/v1/config. When the file cannot be read or fails validation (for
        example while it is half-edited), the previous configuration stays in
        place and the response is still 200, with reload_error explaining why.
      operationId: reloadConfig
      responses:
        '200':
          description: The runtime-mutable configuration after the reload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
  /api/v1/hooks:
    get:
      tags: [System]
      summary: List the available job hooks
      description: >-
        Returns the global switch and entry metadata loaded from hooks.yaml at
        process startup, in file order. Every enabled entry that matches a job's
        event and type runs for it. An entry's enabled value is the result after defaults are
        applied; an empty job_types array matches every job type. The response never
        includes the URL, headers, command, workdir or any other configuration field
        that may carry secrets.
      operationId: listHooks
      responses:
        '200':
          description: The redacted hooks configuration; when nothing is configured, enabled is false and entries is an empty array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HooksResponse'
  /api/v1/library-sync:
    get:
      tags: [System]
      summary: Get the library monitor status
      description: >-
        Returns the monitor's current state: the switch and interval from the
        configuration, plus what the most recent poll observed. It is returned even
        when the feature is off, so clients do not have to guess the switch state.

        Apple does not expose when a track was added to the library (library-songs
        has no dateAdded attribute, and a library album's dateAdded is when the
        album's first track was added and does not change when songs are added to it
        later), but the **order** of sort=-dateAdded is reliable. So the watermark is
        a position rather than a time: the newest batch of track ids is remembered
        as the anchor, each poll reads newest-first until it reaches the oldest
        track in the anchor, and anything in between that is not in the anchor is
        new. anchor_size is the number of ids in that batch.
      operationId: getLibrarySyncStatus
      responses:
        '200':
          description: Monitor status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySyncStatus'
  /api/v1/library-sync/reset:
    post:
      tags: [System]
      summary: Reset the library monitor anchor
      description: >-
        Clears the anchor. The next poll finds no anchor, so it re-anchors on the
        library as it is **at that moment** and **submits no albums** — this
        "forgets history" rather than "replays history", and will not flood the
        download queue.

        Use it when the monitor's idea of what is "already there" has drifted from
        reality. To download a particular album again, submit it directly with
        POST /api/v1/downloads; this endpoint cannot do that.
      operationId: resetLibrarySyncAnchor
      responses:
        '200':
          description: The anchor has been cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySyncResetResponse'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/wrapper/status:
    get:
      tags: [Wrapper]
      summary: Get wrapper status
      description: >-
        Probes the wrapper (wrapper-lite, or the wrapper-manager in front of it)
        for connectivity and runtime state such as login and regions; use it
        before downloading or managing accounts. login_supported tells whether
        the login routes work against this wrapper.
      operationId: getWrapperStatus
      responses:
        '200':
          description: Wrapper status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrapperStatus'
        '503':
          description: wrapper_unavailable; the wrapper did not answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/wrapper/login:
    post:
      tags: [Wrapper]
      summary: Log in to a wrapper account
      description: >-
        Login may succeed immediately, or return a login_id that requires a
        two-step verification code. The username is trimmed; the password is
        forwarded exactly as sent, because spaces can be part of it (a password
        that is only whitespace is 400 invalid_request). The password of a login
        that waits for its code is kept in memory for at most 75 seconds while
        no code has arrived and, once a code is submitted, until its
        verification ends: at most 75 seconds plus wrapper.login_timeout_seconds
        (195 seconds by default) after the needs_2fa response. It is never
        written to disk by a wrapper-manager. A wrapper amdl runs on this
        machine (WrapperStatus.managed) logs in by booting its guest with the
        password in a 0600 file passed through QEMU fw_cfg and deleted at the
        guest's first console line; the guest copies it to its disk, and amdl
        zeroes that copy before the next boot, which follows at once
        (managed.login_residue). It answers within several minutes, since the
        guest boots twice and may run emulated, and a caller that disconnects
        before this call answers ends the login (a submitted two-step code
        runs to its outcome either way). A username with a colon, or either
        value with a line break or NUL, is 400 invalid_request, and a managed
        wrapper turned off with amdl wrapper stop is 503 wrapper_unavailable.
        Needs a wrapper-manager or a managed wrapper; a bare wrapper-lite
        answers 501 login_unsupported.
      operationId: loginWrapper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedInResponse'
        '202':
          description: A two-step verification code must be submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeedsTwoStepResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          description: wrapper_unavailable; the managed wrapper is stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/wrapper/login/{login_id}/2fa:
    post:
      tags: [Wrapper]
      summary: Submit a two-step verification code
      description: >-
        Finishes the login that returned the login_id. The wrapper gives up on a
        login 60 seconds after it asks for the code (four minutes for a
        managed wrapper), so submit it promptly. The
        login ends with this call even when the code is wrong; start again from
        POST /wrapper/login. A managed wrapper answers a code that is not six
        digits with 400 invalid_request and keeps the login waiting for the
        right one.
      operationId: submitWrapperTwoStepCode
      parameters:
        - $ref: '#/components/parameters/LoginID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedInResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/wrapper/logout:
    post:
      tags: [Wrapper]
      summary: Log out of a wrapper account
      description: >-
        Ends the account's login in the wrapper-manager and deletes its data
        there. A bare wrapper-lite answers 501 login_unsupported.
      operationId: logoutWrapper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedOutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/quality:
    post:
      tags: [Quality]
      summary: Query the available audio qualities of the songs in a link
      description: |
        Resolves an Apple Music song, album, playlist, artist or station URL that the
        backend supports and returns, for each song, a summary of the codecs,
        bitrates, sample rates and bit depths its master playlist currently declares;
        no download job is created.
        Every link type returns a tracks array: a song has one element, and
        collections keep Apple Music's original order and repeated track occurrences.
        The i parameter on an album URL still follows the runtime
        catalog.album_track_url_mode; station resolution uses the runtime
        media-user-token (the wrapper's when amdl can read it, else
        catalog.media_user_token). Internally this reuses the download jobs' region
        check, collection resolution, track metadata refresh, retries, concurrency
        scheduling, HLS source selection and codec/ALAC filtering rules. On the
        normal success path, each track occurrence reads its master playlist once
        and all qualities are summarized from it; on failure the source is fetched
        again and the master re-read, up to download.max_attempts. The query does
        not read individual media playlists, does not verify media segments, and
        never enters the encrypted media transfer. The region check requires the
        wrapper/decryptor to be ready and the URL's storefront to be among the
        regions it reports. music-video is not supported. A song for which the
        catalog lists no Enhanced HLS master reports every quality with
        available=false. Apple answering 404 for the link's id, or for a track's,
        is 404 catalog_not_found; any other failure after the url field is
        present, including a URL the backend cannot parse, is 502 upstream_error.
      operationId: queryQuality
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityRequest'
      responses:
        '200':
          description: Summary of the available qualities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: catalog_not_found; Apple answered 404 for the link's id or a track's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '502':
          description: upstream_error; the lookup failed (catalog, wrapper or URL validation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/lookup:
    post:
      tags: [Downloads]
      summary: Preview an Apple Music link without creating a job
      description: |
        Parses one link the way POST /api/v1/downloads does (the i parameter of an
        album URL follows the runtime catalog.album_track_url_mode) and reads the
        catalog metadata a job row shows once it resolves: title, artist or
        curator, artwork with its palette, release date, genre and track count. No
        job is created and nothing is downloaded.

        Each link type costs one light catalog read on the backend's catalog host:
        a song reads the song resource, an album the album with its track list, a
        playlist the playlist with its track list, a station its metadata (never
        the next-tracks feed), an artist the artist alone (so track_count is
        absent). The animated-cover and Enhanced HLS reads are never made. The
        whole lookup is bounded by 15 seconds.

        Only a private (pl.u-) playlist's cover uses a media-user-token: the
        wrapper's when amdl can read it (WrapperStatus.media_user_token), else the
        runtime catalog.media_user_token; the request cannot supply one. It is
        never echoed.

        Once the link has parsed, every error carries it in details.link
        (LookupLink), so a client can still show what was pasted.
      operationId: lookupLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupRequest'
            examples:
              album:
                value: {url: 'https://music.apple.com/us/album/igor/1463409338'}
      responses:
        '200':
          description: The parsed link and its catalog metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
              examples:
                album:
                  value:
                    input: https://music.apple.com/us/album/igor/1463409338
                    type: album
                    storefront: us
                    id: '1463409338'
                    title: IGOR
                    artist_name: Tyler, The Creator
                    artist_url: https://music.apple.com/us/artist/tyler-the-creator/420368335
                    artwork_url: https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/0c/06/05/0c060581-6242-6a2a-a677-20170f2cf8da/886447710180.jpg/{w}x{h}bb.jpg
                    artwork_bg_color: f1a8bf
                    artwork_text_color1: '171615'
                    artwork_text_color2: '272021'
                    artwork_text_color3: '423337'
                    artwork_text_color4: 4f3b41
                    release_date: '2019-05-17'
                    genre: Hip-Hop/Rap
                    track_count: 12
                    content_rating: explicit
                    apple_digital_master: true
                album_track:
                  value:
                    input: https://music.apple.com/us/album/midnights/1650841512?i=1650841515
                    type: song
                    storefront: us
                    id: '1650841515'
                    track_id: '1650841515'
                    title: Anti-Hero
                    artist_name: Taylor Swift
                    artist_url: https://music.apple.com/us/artist/taylor-swift/159260351
                    album_name: Midnights (3am Edition)
                    artwork_url: https://is1-ssl.mzstatic.com/image/thumb/Music122/v4/59/13/5c/59135ccc-8425-415c-7f89-8aeada60088e/22UM1IM22440.rgb.jpg/{w}x{h}bb.jpg
                    artwork_bg_color: eae7e3
                    artwork_text_color1: 0d0c13
                    artwork_text_color2: '291216'
                    artwork_text_color3: 39383d
                    artwork_text_color4: 4f3c3f
                    release_date: '2022-10-21'
                    genre: Pop
                    track_count: 1
                    duration_ms: 200690
                    apple_digital_master: true
        '400':
          description: >-
            invalid_json: the body is not well-formed JSON; invalid_request: url is
            missing, the body has an unknown field, the link is not a supported
            Apple Music link, or it is one the backend does not download (a music
            video, a live radio station). The last two carry details.link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >-
            catalog_not_found; Apple answered 404 for the link's id: it has no
            such resource in that storefront. details.link carries the parsed link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: >-
            upstream_error; the catalog read failed. details.link carries the parsed link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: upstream_timeout; the catalog did not answer within 15 seconds. details.link carries the parsed link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/search:
    get:
      tags: [Search]
      summary: Search the catalog for songs, albums, playlists and artists
      description: |
        One page of Apple Music catalog hits per requested group, each group in
        Apple's relevance order. Nothing is downloaded and no job is created.
        limit and offset apply to each group; a group with more hits carries
        next_offset. Apple reports no totals.

        A hit's url downloads exactly that item when submitted to POST
        /api/v1/downloads. prior_job names the job that put a hit in the
        library or holds it in the queue; a failed read of the job store
        leaves hits unmarked instead of failing the search. The catalog read
        is bounded by 10 seconds.
      operationId: searchCatalog
      parameters:
        - name: term
          in: query
          required: true
          description: >-
            What to search for. Leading and trailing white space is trimmed and
            inner runs of it count as one space; at most 200 characters after that.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: types
          in: query
          description: >-
            The groups to search; repeat the parameter or separate values with
            commas. Default all four. Groups are returned in the order songs,
            albums, playlists, artists whatever the order given.
          schema:
            type: array
            items:
              type: string
              enum: [songs, albums, playlists, artists]
          style: form
          explode: true
        - $ref: '#/components/parameters/BrowseStorefront'
        - name: limit
          in: query
          description: Hits per group; default 10, maximum 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - $ref: '#/components/parameters/BrowseOffset'
      responses:
        '200':
          description: The hits, one group per requested type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: >-
            invalid_request; term is missing, blank or too long, or types,
            storefront, limit or offset is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: catalog_not_found; Apple answered 404 for the search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: upstream_error; the catalog read failed (Apple refuses an unknown storefront).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: upstream_timeout; the catalog did not answer within 10 seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/artists/{artist_id}/albums:
    get:
      tags: [Search]
      summary: List an artist's albums, one page at a time
      description: |
        The artist and one page of its albums, in the order of Apple's albums
        relationship: the albums an artist download (POST /api/v1/downloads with
        the artist's url) takes. Every page carries the artist. The artist and
        the page are read at once, bounded by 10 seconds together.
      operationId: listArtistAlbums
      parameters:
        - name: artist_id
          in: path
          required: true
          description: The artist's Apple Music catalog id, the id of an artist search hit.
          schema:
            type: string
            pattern: '^[0-9]{1,20}$'
        - $ref: '#/components/parameters/BrowseStorefront'
        - name: limit
          in: query
          description: Albums per page; default 25, maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - $ref: '#/components/parameters/BrowseOffset'
      responses:
        '200':
          description: The artist and a page of its albums.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistAlbumsResponse'
        '400':
          description: invalid_request; the artist id is not digits, or storefront, limit or offset is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: catalog_not_found; Apple answered 404 for the artist id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: upstream_error; the catalog read failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: upstream_timeout; the catalog did not answer within 10 seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/albums/{album_id}:
    get:
      tags: [Search]
      summary: Get an album and its songs
      description: |
        The album's metadata and its song list in disc and track order: the songs
        an album download (POST /api/v1/downloads with the album's url) takes,
        music videos excluded. The metadata fields have the names and meaning of
        the LookupResponse fields of the same name. The whole list comes in one
        answer, bounded by 15 seconds like POST /api/v1/lookup, which reads the
        same album. A song's url submitted to POST /api/v1/downloads downloads
        that song alone.

        Nothing here says whether a song is on disk: where it lands depends on
        the quality and codec a download picks. To mark the songs of an album a
        job downloaded, read that job (GET /api/v1/downloads/{job_id}, from the
        `prior_job` of the album's search hit) and match its items' `adam_id`
        with the songs' `id`.
      operationId: getAlbum
      parameters:
        - name: album_id
          in: path
          required: true
          description: The album's Apple Music catalog id, the id of an album search hit.
          schema:
            type: string
            pattern: '^[0-9]{1,20}$'
        - $ref: '#/components/parameters/BrowseStorefront'
      responses:
        '200':
          description: The album and its songs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumResponse'
              examples:
                album:
                  value:
                    storefront: cn
                    id: '1783644603'
                    url: 'https://music.apple.com/cn/album/1783644603'
                    title: 迷跡波
                    artist_name: 'MyGO!!!!!'
                    artist_url: 'https://music.apple.com/cn/artist/mygo/1653702916'
                    artwork_url: 'https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/88/b2/f8/88b2f80a-6688-c72e-9ca6-c6066f30c0d8/198704278525_Cover.jpg/{w}x{h}bb.jpg'
                    artwork_bg_color: '4e808e'
                    artwork_text_color1: '030607'
                    artwork_text_color2: '131313'
                    artwork_text_color3: '121e22'
                    artwork_text_color4: '1e282b'
                    release_date: '2023-11-01'
                    genre: 动画
                    track_count: 13
                    disc_count: 1
                    apple_digital_master: true
                    audio_traits: [hi-res-lossless, lossless, lossy-stereo]
                    tracks:  # the first two of 13
                      - id: '1783644604'
                        url: 'https://music.apple.com/cn/song/%E8%BF%B7%E6%98%9F%E5%8F%AB/1783644604'
                        disc_number: 1
                        track_number: 1
                        name: 迷星叫
                        artist_name: 'MyGO!!!!!'
                        duration_ms: 211373
                        apple_digital_master: true
                        audio_traits: [hi-res-lossless, lossless, lossy-stereo]
                        has_lyrics: true
                      - id: '1783644606'
                        url: 'https://music.apple.com/cn/song/%E5%A3%B1%E9%9B%AB%E7%A9%BA/1783644606'
                        disc_number: 1
                        track_number: 2
                        name: 壱雫空
                        artist_name: 'MyGO!!!!!'
                        duration_ms: 189587
                        apple_digital_master: true
                        audio_traits: [hi-res-lossless, lossless, lossy-stereo]
                        has_lyrics: true
        '400':
          description: invalid_request; the album id is not digits, or storefront is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: catalog_not_found; Apple answered 404 for the album id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: upstream_error; the catalog read failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: upstream_timeout; the catalog did not answer within 15 seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/downloads:
    get:
      tags: [Downloads]
      summary: List download jobs
      description: |
        Returns a snapshot of the download job list, with pagination,
        status and type filters, and substring search over title, artist and
        input URL. Sorted by created_at descending by default. Other query
        parameters are ignored.
        Multi-value parameters (status, type) accept repeated keys or comma
        separation; for example `status=failed&status=cancelled` is equivalent to
        `status=failed,cancelled`.
      operationId: listDownloads
      parameters:
        - name: limit
          in: query
          description: Number of jobs to return; default 50, maximum 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Number of jobs to skip, for pagination; default 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          description: >-
            Filter by job status; repeat the parameter or separate values with
            commas. Allowed values: queued, running, completed, failed, cancelled.
          schema:
            type: array
            items:
              type: string
              enum: [queued, running, completed, failed, cancelled]
          style: form
          explode: true
        - name: type
          in: query
          description: >-
            Filter by job type; repeat the parameter or separate values with commas.
            Allowed values: song, album, playlist, artist, station.
          schema:
            type: array
            items:
              type: string
              enum: [song, album, playlist, artist, station]
          style: form
          explode: true
        - name: q
          in: query
          description: >-
            Substring search over the job's title, artist name and input (SQLite LIKE;
            case-insensitive for ASCII letters). `%` and `_` match literally.
          schema:
            type: string
        - name: sort
          in: query
          description: >-
            Sort field; default created_at. Jobs that tie on it (a batch submitted
            together shares one created_at) list in submission order, whatever the
            order parameter says.
          schema:
            type: string
            enum: [created_at, updated_at]
            default: created_at
        - name: order
          in: query
          description: Sort direction; default desc.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Snapshot of the download job list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadList'
        '400':
          description: invalid_request; invalid query parameters (unknown enum value, bad time format, limit/offset out of range, and so on).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/StoreError'
    post:
      tags: [Downloads]
      summary: Create download jobs in bulk
      description: >-
        Submits a batch of URLs and returns the enqueue result for each one;
        duplicate, unsupported or queue-full URLs are flagged individually in
        results without affecting the other URLs. Each URL that was not accepted
        carries an error object (SubmitError) with a stable code. The answer is
        202 with the BatchSubmitResponse when at least one URL was accepted. When
        none was, it is an ErrorResponse whose details is the BatchSubmitResponse:
        500 store_error if any URL failed in the job store (status error; the same
        submit may succeed when retried), 500 internal_error if the only server
        failure was an unexpected validator error, else 422 no_urls_accepted. The optional overrides field
        applies to the jobs created by this request and overrides the quality and
        force_overwrite keys of the runtime download configuration. The
        media-user-token is the wrapper's when amdl can read it, else the runtime
        catalog.media_user_token (never one from the request), and every
        enabled hooks.yaml entry that matches runs for every job.
      operationId: createDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadRequest'
      responses:
        '202':
          description: At least one URL was enqueued; see results for the per-URL outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSubmitResponse'
        '400':
          description: >-
            invalid_json: the body cannot be parsed; invalid_request: it contains
            unknown fields (for example media_user_token at the top level or
            inside overrides, a key overrides does not carry such as hooks or
            downloads_dir, or a misspelled key), urls is empty, or it exceeds the
            per-request limit (100 URLs). The message names the unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/JSONBodyTooLarge'
        '422':
          description: >-
            no_urls_accepted: every URL was rejected, and error.details is the
            BatchSubmitResponse with each URL's reason; invalid_overrides:
            overrides failed configuration validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            store_error (or internal_error): no URL was accepted and at least one
            failed on the server side (status error); error.details is the
            BatchSubmitResponse. Retry the submit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/downloads/events:
    get:
      tags: [Downloads]
      summary: Subscribe to download list changes (SSE)
      description: |
        Overview event stream: GET /downloads is a one-off snapshot of the list,
        while this endpoint pushes incremental changes live as the list changes;
        both are ways to read the same state. Each push is a DownloadFeedMessage:
        - download_upserted: a job was created or changed (queued, started,
          progress as each song finishes, terminal state); data.job is the job's
          latest snapshot (item counters derived from its items);
        - download_deleted: a job was deleted; data.job_id is the deleted job's id.
        Both message types carry status_counts, the latest status counts of all
        jobs at the moment the message was generated; in a delete message the
        deleted job has already been subtracted.
        Only "milestone" events that affect how the list is displayed trigger a
        push (created/recovered/started/input resolved/animated cover
        resolved/song completed, skipped or failed/terminal state/deleted);
        per-track progress events are not pushed. Instead, every 2 seconds the
        feed sends a download_upserted for each running job whose progress has
        moved since it was last sent, with the event_id already reached.
        The animated cover is the only kind of change that can still arrive after a
        job reaches a terminal state: it is resolved out of band, and by then the
        per-job event stream has usually closed, so only this endpoint delivers it.
        Resuming: first GET /downloads to obtain event_cursor, then connect with
        ?cursor=<event_cursor> (or the Last-Event-ID header) to receive only the
        changes made after that snapshot. Never connect without a cursor: that
        replays the whole retained milestone history. download_upserted and
        download_deleted both carry event_id, which is also the SSE id; after
        processing each message, the client uses it as its new resume cursor.
        The feed never ends on its own.
      operationId: streamDownloadsFeed
      parameters:
        - $ref: '#/components/parameters/StreamCursor'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          description: SSE event stream; each data is one DownloadFeedMessage.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/downloads/{job_id}:
    get:
      tags: [Downloads]
      summary: Get download job details
      operationId: getDownload
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: The job, its items, its hook states and the event cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadDetail'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '500':
          $ref: '#/components/responses/StoreError'
    delete:
      tags: [Downloads]
      summary: Delete a download job
      description: Deletes a job in a terminal state (completed/failed/cancelled) together with its items and event records. A queued or running job must be cancelled first.
      operationId: deleteDownload
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: The job has been deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: deleted
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          description: job_active; the job is still queued or running (cancel it first), finalizing, or running a hook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/downloads/{job_id}/cancel:
    post:
      tags: [Downloads]
      summary: Cancel a download job
      operationId: cancelDownload
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: The job has been cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: cancelled
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          description: >-
            job_not_cancellable; the job already ended completed or failed. A
            cancelled job answers 200 again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/downloads/{job_id}/retry:
    post:
      tags: [Downloads]
      summary: Retry a failed or cancelled download job
      description: |
        Re-enqueues a job in the failed or cancelled terminal state; only unfinished
        tracks are actually retried: items that already completed (completed) or were
        skipped (skipped_existing) keep their state and are not downloaded again; the
        remaining items (failed, cancelled, etc.) are reset to queued and reprocessed
        under their original item ids, with the job's overrides unchanged.
        Re-enqueueing records and pushes a job_retried event (an overview milestone
        event, which drives the GET /downloads overview feed).
      operationId: retryDownload
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '202':
          description: The job has been re-enqueued.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: queued
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          description: |
            job_not_retryable: the job is not in the failed or cancelled state;
            duplicate_active: a queued/running job for the same link already
            exists; job_finalizing: the previous run is still wrapping up (the
            terminal state was just written but worker cleanup/hook dispatch has
            not finished; the window is very short, so simply retry a moment
            later).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: queue_full; the job queue is full, retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/StoreError'
  /api/v1/downloads/{job_id}/events:
    get:
      tags: [Downloads]
      summary: Subscribe to download job events
      description: |
        Server-Sent Events stream of one job, resumable from the Last-Event-ID
        header or ?cursor= (seed it from event_cursor of GET
        /downloads/{job_id}). Each SSE event is named after its EventType, its id
        is the event id, and its data is an Event object, whose payload is a JSON
        object. The payload of job lifecycle events
        (job_queued/job_recovered/job_retried/job_started/resolved_input/job_finished/job_failed/job_cancelled)
        contains the same public fields as the REST `Job`; the payload of track
        status events contains the same public fields as the REST `JobItem` and
        keeps the event's own specific fields (e.g. download_attempts,
        will_retry). Clients can therefore merge events directly, without an extra
        GET after the terminal event to obtain the complete final state.
        When the job is already in a terminal state (completed/failed/cancelled):
        if there are historical events not yet delivered to this client (including
        the terminal event itself, and the hook_started/hook_succeeded/hook_failed
        events of post-download hooks still running — hooks fire asynchronously
        and may be recorded only after the job reaches its terminal state), those
        events are replayed as-is first; the connection stays open while any hook
        is still running and closes only once the hooks finish. When the client has
        already caught up on every event and no hook is still running, the answer
        is 204 No Content, which makes a browser EventSource stop reconnecting.
        A browser reports any non-200 answer as a generic error, so a client
        whose stream ended refetches GET /downloads/{job_id} to tell "finished"
        from "broken".
      operationId: streamDownloadEvents
      parameters:
        - $ref: '#/components/parameters/JobID'
        - $ref: '#/components/parameters/StreamCursor'
        - $ref: '#/components/parameters/LastEventID'
      responses:
        '200':
          description: SSE event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '204':
          description: >-
            The job is in a terminal state, no hook is still running, and the client
            has caught up on every event; no new events will be produced.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '500':
          $ref: '#/components/responses/StoreError'
components:
  parameters:
    LoginID:
      name: login_id
      in: path
      required: true
      schema:
        type: string
      example: 4f0f2c79acda4c28b69ebf4f702f8a51
    JobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
      example: job_01JZ0000000000000000000000
    LogLevel:
      name: level
      in: query
      description: Comma-separated exact severity levels; allowed values are debug, info, warn and error.
      schema:
        type: string
      example: warn,error
    LogComponent:
      name: component
      in: query
      description: Exact match on the component attribute, e.g. api, jobs, media, catalog, hooks, main.
      schema: {type: string}
    LogRequestID:
      name: request_id
      in: query
      description: Exact match on the HTTP request correlation ID.
      schema: {type: string}
    LogJobID:
      name: job_id
      in: query
      description: Exact match on the download job ID.
      schema: {type: string}
    LogQuery:
      name: q
      in: query
      description: Case-insensitive substring match over the message and structured attributes.
      schema: {type: string}
    LogSince:
      name: since
      in: query
      description: Inclusive lower bound (entries at this instant are included); RFC3339 timestamp.
      schema: {type: string, format: date-time}
    LogUntil:
      name: until
      in: query
      description: Inclusive upper bound (entries at this instant are included); RFC3339 timestamp.
      schema: {type: string, format: date-time}
    LogCursor:
      name: cursor
      in: query
      description: >-
        Only return entries whose sequence is greater than this value (next_cursor
        of the previous page, or the last SSE id received). A value that is not a
        non-negative integer is 400 invalid_request.
      schema: {type: integer, format: int64, minimum: 0}
    StreamCursor:
      name: cursor
      in: query
      description: >-
        Resume point: replay only events whose id is greater than this value. Use
        event_cursor from the matching snapshot (GET /downloads or GET
        /downloads/{job_id}) for the first connect. Ignored when Last-Event-ID is
        set. A value that is not a non-negative integer is 400 invalid_request.
      schema: {type: integer, format: int64, minimum: 0}
    LastEventID:
      name: Last-Event-ID
      in: header
      description: >-
        Resume point, sent by EventSource on every automatic reconnect; it wins
        over ?cursor=. A value that is not a non-negative integer is 400
        invalid_request.
      schema:
        type: string
        pattern: '^[0-9]+$'
    LogLimit:
      name: limit
      in: query
      description: Maximum number of entries to return or replay; default 200 for queries and 500 for SSE.
      schema: {type: integer, minimum: 1, maximum: 1000}
    BrowseStorefront:
      name: storefront
      in: query
      description: >-
        Two-letter Apple Music storefront code, case-insensitive; default
        catalog.default_storefront.
      schema:
        type: string
        pattern: '^[A-Za-z]{2}$'
    BrowseOffset:
      name: offset
      in: query
      description: Where the page starts; default 0. Pass a next_offset to read the next page.
      schema:
        type: integer
        minimum: 0
        default: 0
    StatsDays:
      name: days
      in: query
      description: Number of UTC calendar days in the daily series and hook window, ending today; default 14.
      schema: {type: integer, minimum: 1, maximum: 90, default: 14}
  responses:
    BadRequest:
      description: invalid_request or invalid_json; invalid request parameters or body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JSONBodyTooLarge:
      description: request_too_large; the JSON request body exceeds the 1 MiB limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: authentication_failed; wrong login credentials or verification code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: >-
        login_not_found: the two-step login session does not exist or expired;
        account_not_found: no wrapper runs for that account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    JobNotFound:
      description: job_not_found; no job has this id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: >-
        already_logged_in: the account already has a wrapper; login_pending: a
        login for the account (or this session's two-step code) is already in
        progress.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotImplemented:
      description: >-
        login_unsupported; the wrapper is a bare wrapper-lite, which logs in only
        from its own command line. Log in on the wrapper host instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: upstream_error; the wrapper returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: upstream_timeout; the wrapper login timed out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: internal_error; an unexpected server failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StoreError:
      description: store_error; the job store failed. The request may succeed when retried.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      description: >-
        The body of every non-2xx JSON response except the 503 of GET
        /api/v1/health.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable explanation; may change between releases.
            details:
              description: >-
                Code-specific data. no_urls_accepted and store_error from POST
                /downloads: the BatchSubmitResponse. config_key_not_mutable:
                {"keys": [...]}, the rejected fields as dotted key names. Errors
                of POST /lookup after the link parsed: {"link": LookupLink}.
    ErrorCode:
      type: string
      description: |
        Stable, machine-readable error code, sent with the status listed here.
        400 invalid_request (query or body validation), invalid_json (the body
        is not well-formed JSON); 401 authentication_failed; 404
        route_not_found, job_not_found, login_not_found, account_not_found,
        catalog_not_found (Apple has no resource with that id); 405
        method_not_allowed (with an Allow header); 409 job_active,
        job_not_retryable, job_not_cancellable, job_finalizing, duplicate_active, already_logged_in,
        login_pending; 413 request_too_large; 422
        invalid_overrides, config_key_not_mutable, invalid_config,
        no_urls_accepted; 500 internal_error, store_error
        (retrying may succeed); 501 login_unsupported; 502 upstream_error; 503 queue_full,
        wrapper_unavailable, feature_unavailable (the process keeps no log
        history, so the log routes cannot answer); 504 upstream_timeout.
      enum:
        - invalid_request
        - invalid_json
        - authentication_failed
        - route_not_found
        - job_not_found
        - login_not_found
        - account_not_found
        - catalog_not_found
        - method_not_allowed
        - job_active
        - job_not_retryable
        - job_not_cancellable
        - job_finalizing
        - duplicate_active
        - already_logged_in
        - login_pending
        - request_too_large
        - invalid_overrides
        - config_key_not_mutable
        - invalid_config
        - no_urls_accepted
        - internal_error
        - store_error
        - login_unsupported
        - upstream_error
        - queue_full
        - wrapper_unavailable
        - feature_unavailable
        - upstream_timeout
    WrapperStatus:
      type: object
      required: [ready, logged_in, regions, accounts, login_supported, media_user_token]
      properties:
        ready:
          type: boolean
          description: >-
            The wrapper answered; for a wrapper-manager, also that it has
            restored its accounts after a start.
        logged_in:
          type: boolean
          description: An account is logged in and serves at least one storefront.
        regions:
          type: array
          description: Storefronts the wrapper's account serves; an empty array when none.
          items:
            type: string
        accounts:
          type: array
          description: >-
            Logged-in wrapper account identifiers; an empty array when no account
            is logged in or the wrapper does not report them. Neither
            wrapper-lite nor wrapper-manager does, so a logout names the account
            itself.
          items:
            type: string
        login_supported:
          type: boolean
          description: >-
            The wrapper is a wrapper-manager or a managed wrapper, so POST
            /wrapper/login and /wrapper/logout work. False for a bare
            wrapper-lite, which those routes answer with 501 login_unsupported;
            no login can start there, so /wrapper/login/{login_id}/2fa has no
            session to find.
        managed:
          $ref: '#/components/schemas/ManagedWrapper'
        media_user_token:
          type: string
          description: >-
            The wrapper account's media-user-token as amdl reads it, masked like
            catalog.media_user_token in GET /config: "..." and its last four
            characters. "" when amdl cannot read one: it runs no wrapper and
            wrapper.data_dir is unset, the file is missing or unreadable, or it
            does not hold a token. While it is not "", downloads, lookups and
            library sync use it instead of catalog.media_user_token.
          example: "...a1b2"
    ManagedWrapper:
      type: object
      description: >-
        Present only when amdl runs the wrapper on this machine in a QEMU
        guest (amdl wrapper install). While that guest boots or is stopped,
        GET /wrapper/status answers 200 with ready false instead of 503.
      required: [mode, accel, accel_fallback, qemu, guest, login_residue]
      properties:
        mode:
          type: string
          enum: [starting, serving, login, stopped, failed]
        accel:
          type: string
          description: The QEMU accelerator in use, such as kvm, whpx, hvf or tcg (plain emulation).
        accel_fallback:
          type: boolean
          description: The chosen accelerator failed and the guest runs on tcg.
        qemu:
          type: string
          description: The QEMU binary that runs the guest.
        guest:
          type: string
          description: The installed guest, named by its upstream commit or as an import.
        login_residue:
          type: boolean
          description: >-
            The guest disk may still hold the last login's arguments, password
            included: amdl zeroes them before the next serving boot.
        last_error:
          type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database_error:
          type: string
    SystemInfo:
      type: object
      required: [version, commit, build_date, go_version, os, arch, started_at, uptime_seconds, simulate, motion_artwork_enabled, default_storefront, jobs, pools, tools, storage, startup]
      properties:
        version:
          type: string
          description: Release tag the binary was built from; dev for a build without -ldflags.
        commit:
          type: string
          description: Abbreviated commit hash; empty when unknown.
        build_date:
          type: string
          description: RFC 3339 build time; without -ldflags the commit time from the VCS stamp, or empty.
        go_version:
          type: string
        os:
          type: string
        arch:
          type: string
        started_at:
          type: string
          format: date-time
          description: When this process started.
        uptime_seconds:
          type: integer
          format: int64
          minimum: 0
        simulate:
          type: boolean
          description: simulate.enabled; jobs simulate transfer, decryption and file writes.
        motion_artwork_enabled:
          type: boolean
          description: catalog.motion_artwork_enabled.
        default_storefront:
          type: string
          description: >-
            catalog.default_storefront, a startup key (not in RuntimeConfig). The
            API itself refuses a link without a storefront in its path (a
            submit result with invalid_url); a client that accepts such links, as
            the web console does, completes them with this value.
        jobs:
          type: object
          required: [workers, active, queue_depth, queue_capacity, recovery_backlog]
          properties:
            workers:
              type: integer
              description: Worker count, fixed at startup by download.max_running_jobs.
            active:
              type: integer
              description: Jobs being processed now.
            queue_depth:
              type: integer
              description: Admitted jobs waiting for a worker.
            queue_capacity:
              type: integer
              description: Admission queue size; a submission that finds it full is queue_full.
            recovery_backlog:
              type: integer
              description: Jobs recovered at startup still waiting for a worker; unbounded and served first.
        pools:
          type: object
          required: [downloads, decrypts, wrapper_requests]
          description: >-
            Process-wide pool sizes, fixed at startup: downloads is
            download.max_parallel_downloads; decrypts is the number of CPUs the
            backend uses (GOMAXPROCS, which follows a container CPU limit);
            wrapper_requests (4) is built-in.
          properties:
            downloads:
              type: integer
            decrypts:
              type: integer
            wrapper_requests:
              type: integer
        tools:
          type: array
          description: External commands the pipeline runs (ffmpeg), looked up on PATH.
          items:
            type: object
            required: [name, available]
            properties:
              name:
                type: string
              available:
                type: boolean
              path:
                type: string
                description: Resolved executable path when available.
              error:
                type: string
                description: Why the lookup failed.
        storage:
          type: array
          description: >-
            Free space of downloads_dir and temp_dir, in that order. Either both
            byte counts or error is present; error is set when the directory
            cannot be inspected (for example it does not exist).
          items:
            type: object
            required: [name, path]
            properties:
              name:
                type: string
                enum: [downloads_dir, temp_dir]
              path:
                type: string
                description: The configured path, made absolute against the backend's working directory.
              free_bytes:
                type: integer
                format: int64
                minimum: 0
                description: Bytes available to the backend's user.
              total_bytes:
                type: integer
                format: int64
                minimum: 0
              error:
                type: string
        startup:
          type: object
          required: [config_path, wrapper_address, listen, database_path, log_buffer_size, catalog_language, max_parallel_requests]
          description: >-
            Configuration read only at startup (none of it is in RuntimeConfig),
            for a client to show as facts. It carries no credential.
          properties:
            config_path:
              type: string
              description: >-
                Absolute path of the config file PUT /config writes and startup keys
                are edited in; "" when the backend keeps its config in memory only.
            wrapper_address:
              type: string
              description: >-
                wrapper.address without user info, query or fragment, so an
                address written with credentials is not echoed back.
            listen:
              type: string
              description: server.listen.
            database_path:
              type: string
              description: database.path, made absolute against the backend's working directory.
            log_buffer_size:
              type: integer
              description: logging.buffer_size; 0 keeps no log history.
            catalog_language:
              type: string
              description: catalog.language.
            max_parallel_requests:
              type: integer
              minimum: 1
              description: >-
                Size of the Apple request pool: catalog.max_parallel_requests, or 1
                when that is 0 or less.
      example:
        version: v2.0.0
        commit: a6a6b46
        build_date: '2026-10-28T12:00:00Z'
        go_version: go1.26.5
        os: linux
        arch: amd64
        started_at: '2026-10-28T12:00:05Z'
        uptime_seconds: 3600
        simulate: false
        motion_artwork_enabled: true
        jobs: {workers: 3, active: 1, queue_depth: 0, queue_capacity: 256, recovery_backlog: 0}
        pools: {downloads: 16, decrypts: 32, wrapper_requests: 4}
        tools:
          - {name: ffmpeg, available: true, path: /usr/bin/ffmpeg}
        storage:
          - {name: downloads_dir, path: /srv/amdl/data/downloads, free_bytes: 512000000000, total_bytes: 1000000000000}
          - {name: temp_dir, path: /srv/amdl/data/tmp, error: 'statfs /srv/amdl/data/tmp: no such file or directory'}
        startup:
          config_path: /srv/amdl/configs/config.yaml
          wrapper_address: http://127.0.0.1:12340
          listen: 127.0.0.1:18080
          database_path: /srv/amdl/data/db/amdl.db
          log_buffer_size: 2000
          catalog_language: en-US
          max_parallel_requests: 16
    Stats:
      type: object
      required: [generated_at, days, totals, daily, codecs, hooks]
      properties:
        generated_at:
          type: string
          format: date-time
          description: When this result was computed; a cached result keeps its time.
        days:
          type: integer
          minimum: 1
          maximum: 90
        totals:
          type: object
          description: Every retained job and its items, not only the window.
          required: [jobs, tracks_completed, tracks_skipped, tracks_failed, bytes_written, duration_ms]
          properties:
            jobs:
              type: integer
            tracks_completed:
              type: integer
              description: Items with status completed (written by this backend).
            tracks_skipped:
              type: integer
              description: Items with status skipped_existing (already on disk).
            tracks_failed:
              type: integer
            bytes_written:
              type: integer
              format: int64
              description: Sum of file_size over completed items, in bytes.
            duration_ms:
              type: integer
              format: int64
              description: Sum of the playback duration of completed items, in milliseconds.
        daily:
          type: array
          description: >-
            Exactly `days` entries, one per UTC calendar day, oldest first, ending
            today; a day without activity has zeros. A track counts on the day of
            its last item_completed event; a job counts once per job_finished or
            job_failed event.
          items:
            type: object
            required: [date, tracks_completed, bytes_written, jobs_completed, jobs_failed]
            properties:
              date:
                type: string
                format: date
              tracks_completed:
                type: integer
              bytes_written:
                type: integer
                format: int64
              jobs_completed:
                type: integer
              jobs_failed:
                type: integer
        codecs:
          type: array
          description: Completed items of every retained job, grouped by codec, bit depth and sample rate; most tracks first.
          items:
            type: object
            required: [codec, bit_depth, sample_rate, tracks]
            properties:
              codec:
                type: string
              bit_depth:
                type: integer
              sample_rate:
                type: integer
              tracks:
                type: integer
        hooks:
          type: array
          description: >-
            Outcomes recorded inside the window per hook name (hook_succeeded and
            hook_failed events), sorted by name. A hook with no outcome in the
            window is absent.
          items:
            type: object
            required: [name, succeeded, failed]
            properties:
              name:
                type: string
              succeeded:
                type: integer
              failed:
                type: integer
              last_failed_at:
                type: string
                format: date-time
                description: The latest failure inside the window; absent when there was none.
      example:
        generated_at: '2026-10-28T13:00:00Z'
        days: 2
        totals: {jobs: 12, tracks_completed: 210, tracks_skipped: 4, tracks_failed: 1, bytes_written: 9876543210, duration_ms: 52000000}
        daily:
          - {date: '2026-10-27', tracks_completed: 0, bytes_written: 0, jobs_completed: 0, jobs_failed: 0}
          - {date: '2026-10-28', tracks_completed: 21, bytes_written: 987654321, jobs_completed: 1, jobs_failed: 0}
        codecs:
          - {codec: alac, bit_depth: 24, sample_rate: 96000, tracks: 120}
          - {codec: alac, bit_depth: 16, sample_rate: 44100, tracks: 90}
        hooks:
          - {name: notify, succeeded: 10, failed: 1, last_failed_at: '2026-10-28T09:15:00Z'}
    HooksResponse:
      type: object
      additionalProperties: false
      required: [enabled, entries]
      properties:
        enabled:
          type: boolean
          description: The global enabled switch of hooks.yaml.
        entries:
          type: array
          description: The entries in hooks.yaml, in their configured file order.
          items:
            $ref: '#/components/schemas/HookEntry'
    HookEntry:
      type: object
      additionalProperties: false
      required: [name, enabled, type, events, job_types]
      properties:
        name:
          type: string
        enabled:
          type: boolean
          description: Enabled state after applying the rule that an omitted enabled defaults to true.
        type:
          type: string
          enum: [webhook, exec]
        events:
          type: array
          items:
            type: string
            enum: [job_queued, job_finished, job_failed, job_cancelled]
        job_types:
          type: array
          description: An empty array means the entry matches every job type.
          items:
            type: string
            enum: [song, album, playlist, artist, station]
    LogEntry:
      type: object
      required: [sequence, time, level, message]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        attributes:
          type: object
          additionalProperties: true
    LogListResponse:
      type: object
      required: [logs, next_cursor, oldest_sequence, truncated]
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        next_cursor:
          type: integer
          format: int64
          minimum: 0
        oldest_sequence:
          type: integer
          format: int64
          minimum: 0
          description: The oldest global sequence number currently in the in-memory buffer; 0 when the buffer is empty.
        truncated:
          type: boolean
          description: Whether entries after the cursor and before oldest_sequence have already been evicted.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          writeOnly: true
          example: example-password
    TwoStepRequest:
      type: object
      required: [two_step_code]
      properties:
        two_step_code:
          type: string
          example: '123456'
    LogoutRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          example: user@example.com
    LoggedInResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: logged_in
    NeedsTwoStepResponse:
      type: object
      required: [status, login_id]
      properties:
        status:
          type: string
          const: needs_2fa
        login_id:
          type: string
    LoggedOutResponse:
      type: object
      required: [status, username]
      properties:
        status:
          type: string
          const: logged_out
        username:
          type: string
    DownloadRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          description: >-
            List of Apple Music links (song/album/playlist/artist/station). Each
            element may contain several URLs separated by newlines or whitespace,
            which the server splits automatically; at most 100 URLs per request
            after splitting. Stations (station, shaped like
            .../station/.../ra.xxxx) are supported only for personalized/curated
            stations that resolve to a track list, and require a media-user-token
            (the wrapper's, or the runtime catalog.media_user_token); live radio
            stations (Apple Music 1, etc.) have no static track list and cannot
            be downloaded.
          minItems: 1
          items:
            type: string
          example:
            - https://music.apple.com/cn/album/example/123456789?i=987654321
            - https://music.apple.com/cn/album/example/123456789
        overrides:
          $ref: '#/components/schemas/DownloadOverrides'
          description: >-
            Optional configuration overrides that apply only to the jobs created by
            this request. Omitted fields keep the current runtime configuration.
            Download overrides are persisted with each job and still apply after a
            retry or a restart recovery. No override affects any other job.
    DownloadOverrides:
      type: object
      additionalProperties: false
      description: >-
        Per-job override layer for the quality and overwrite keys of the download
        section of the runtime configuration; each field maps one-to-one onto the
        download key of the same name. Every other setting (directories, path
        templates, lyrics, covers, memory_mode, max_attempts, check_integrity and
        hook selection) comes from the runtime configuration and hooks.yaml for
        every job, and the media-user-token is the wrapper's when amdl can read
        it, else the runtime catalog.media_user_token. All fields are optional; on submission the
        full validation runs against "current runtime configuration + overrides",
        and an unknown field is rejected with 400 invalid_request naming it. Job
        rows stored before a field was removed are read with that field ignored.
      properties:
        quality_priority:
          type: array
          items:
            type: string
            enum: [alac, aac, aac-binaural, aac-downmix, ec3, ac3]
        codec_alternative: {type: boolean}
        alac_max_sample_rate: {type: integer}
        alac_max_bit_depth: {type: integer}
        force_overwrite:
          type: boolean
          description: >-
            Whether to force a re-download that overwrites existing output files
            and their lyrics sidecar files. When omitted, the runtime configuration
            value download.force_overwrite applies (default false).
    RuntimeConfig:
      type: object
      description: >-
        The runtime-mutable configuration subset (see the comments in
        configs/config.example.yaml for field meanings, enum values and default
        behavior). GET returns this shape; a PUT may submit only the fields to
        change, and omitted fields keep their current values.
      properties:
        catalog:
          type: object
          description: >-
            max_parallel_requests takes effect only at startup; it does not appear
            here and cannot be changed.
          properties:
            album_track_url_mode:
              type: string
              enum: [song, album]
            media_user_token:
              type: string
              description: >-
                The media-user-token for station downloads, private playlist covers
                and library sync while amdl cannot read the wrapper's own
                (WrapperStatus.media_user_token is ""); while it can, this value
                stays saved but is not used. No request can supply its own. It can be
                changed through PUT and is written back to the configuration file.
                Responses never carry it: a set token reads "..." and its last four
                characters, an unset one "". A PUT whose value starts with "..."
                leaves the saved token unchanged.
            motion_artwork_enabled:
              type: boolean
              description: >-
                Whether to look up Apple Music animated album covers
                (attributes.editorialVideo); default true. When true, each album
                makes one extra amp-api request after it resolves (detached from the
                job context, so it never blocks the download or makes it fail), and
                on success a motion_artwork_resolved event fills in the job's
                motion_artwork_* fields. When false, no request is made and no web
                player token is scraped; jobs carry none of these fields, which to a
                client is exactly the same as "this album has no animated cover".
                Changes take effect for newly started jobs.
        download:
          type: object
          description: >-
            max_running_jobs and max_parallel_downloads take effect only at
            startup; they do not appear here and cannot be changed.
          properties:
            quality_priority:
              type: array
              minItems: 1
              items:
                type: string
                enum: [alac, aac, aac-binaural, aac-downmix, ec3, ac3]
            codec_alternative: {type: boolean}
            memory_mode:
              type: string
              enum: [low, high]
              description: >-
                Controls the Enhanced HLS path. On the normal path, low (default)
                uses bounded per-fragment memory, and the temporary disk peak is
                usually about three files per parallel track; high keeps one
                encrypted copy of the whole track in memory and decrypts it fragment
                by fragment (in-memory media is capped at 512 MiB per track; because
                of Go GC allocation headroom, the actual heap peak can approach
                twice the track size), and the configured temp directory usually
                holds only the final flattened output. AAC-LC is held in memory as a
                whole track in both modes; the rare ALAC integrity repair also reads
                and copies the whole track. In both modes, tagging also briefly
                creates a whole-track rewrite file in the system temp directory.
            max_attempts:
              type: integer
              maximum: 10
              description: Positive values 1-10 are allowed; values <=0 are treated as 1.
            progress_event_interval_ms:
              type: integer
              maximum: 10000
              description: >-
                Minimum interval in milliseconds between two item_progress events
                for the same item within the same status. Only the advance of the
                download/decrypt meters is throttled; status changes
                (waiting_download, downloading, waiting_decrypt, decrypting,
                remuxing, saving, tagging), stage-completion flags (resolved,
                remuxed, verified, tagged, saved) and one-off events such as
                item_completed / item_failed / item_skipped are always pushed
                immediately and are unaffected by this value. A progress value held
                back by the interval is emitted before the event that supersedes
                it, so the last percentage before a status change is never lost,
                and a client resuming from a cursor sees exactly the same event
                sequence as a live client. This is a time floor layered on top of
                the "whole-percentage rounding" threshold, so however small it is
                set, a single meter still emits no more than about 101 events per
                stage. 0-10000 is allowed; values <=0 disable time coalescing and
                keep only the percentage threshold; values above 10000 in the
                configuration file are clamped to 10000, while the config API
                rejects them outright. Default 500. Read once when a job starts, so
                changes only affect jobs started afterwards, not running ones.
            downloads_dir: {type: string}
            song_path_format: {type: string}
            album_path_format: {type: string}
            artist_path_format: {type: string}
            playlist_path_format: {type: string}
            station_path_format: {type: string}
            temp_dir: {type: string}
            cover_size:
              type: string
              pattern: '^[1-9][0-9]*x[1-9][0-9]*$'
              description: >-
                "{width}x{height}" in pixels, e.g. 5000x5000, 3000x3000, 1400x1400,
                600x600; any other value is rejected with 422 invalid_config. If Apple
                cannot serve that size, the standard sizes 5000x5000, 3000x3000,
                1400x1400, 600x600 and 300x300 are tried in turn.
            cover_format:
              type: string
              enum: [jpg, jpeg, png]
            embed_cover: {type: boolean}
            save_album_cover: {type: boolean}
            save_artist_cover: {type: boolean}
            save_playlist_cover: {type: boolean}
            embed_lyrics:
              type: boolean
              description: >-
                Embed the lyrics into the MP4 tag as LRC, shaped by lyrics_timing
                and lyrics_extras.
            lyrics_files:
              type: array
              description: >-
                Lyrics sidecars written next to each track, each format at most
                once: `lrc` holds the same LRC as the tag; `ttml` holds Apple's
                word-timed TTML unchanged, with the translation and romanization
                (none for a song Apple only has plain-text lyrics for). Empty
                writes no sidecar.
              items:
                type: string
                enum: [lrc, ttml]
            lyrics_timing:
              type: string
              enum: [line, word]
              description: >-
                LRC timing. `word` writes enhanced LRC with a time before each
                word, for songs Apple times word by word; others stay line by line.
            lyrics_extras:
              type: array
              description: >-
                Extra LRC lines under each line, with its timestamp, when Apple
                has them and they differ from the line: `translation` (in
                catalog.language) and `pronunciation` (the romanization). The
                `ttml` sidecar always carries both.
              items:
                type: string
                enum: [translation, pronunciation]
            alac_max_sample_rate:
              type: integer
              description: >-
                Hz, a ceiling; 0 or less sets none. Apple Music serves ALAC from 44100
                to 192000 Hz, so a value below 44100 skips every ALAC stream.
            alac_max_bit_depth:
              type: integer
              description: >-
                Bits, a ceiling; 0 or less sets none. Apple Music serves 16- and 24-bit
                ALAC.
            check_integrity: {type: boolean}
            force_overwrite:
              type: boolean
              description: >-
                Whether to force a re-download that overwrites existing output
                files and their lyrics sidecar files; default false. Can be
                overridden per batch with overrides.force_overwrite in the request.
        logging:
          type: object
          description: Only the log level and the HTTP access log switch are runtime-mutable; console and buffer_size require a restart.
          properties:
            level:
              type: string
              enum: [debug, info, warn, error]
            access_log: {type: boolean}
        simulate:
          type: object
          properties:
            enabled: {type: boolean}
            min_speed_kbps: {type: integer}
            max_speed_kbps: {type: integer}
        library_sync:
          type: object
          description: >-
            Library monitor: polls the signed-in Apple Music library and submits
            the albums of newly added tracks as ordinary download jobs (sharing the
            same deduplication, validation and hooks as manual submissions).
            Requires a media-user-token, the wrapper's or catalog.media_user_token
            — a personal library can be read only with the subscription token;
            while neither has one the monitor idles, and last_error in GET
            /api/v1/library-sync shows the status.
          properties:
            enabled:
              type: boolean
              description: >-
                Whether polling is enabled. Default false — this is the only
                feature that creates download jobs on its own. Turning it off really
                stops polling, rather than just discarding the results.
            interval_minutes:
              type: integer
              minimum: 1
              maximum: 1440
              description: >-
                Polling interval in minutes; default 15. The 1440 cap is not a
                resource limit (a poll usually makes only 1 Apple request); it rules
                out values that would show as enabled but never actually fire.
                Changes take effect immediately, with no restart needed.
    LibrarySyncStatus:
      type: object
      required: [enabled, interval_minutes, anchor_size, last_submitted, total_submitted]
      properties:
        enabled:
          type: boolean
          description: Taken from library_sync.enabled in the current runtime configuration.
        interval_minutes:
          type: integer
        anchor_size:
          type: integer
          description: >-
            Number of tracks remembered in the current anchor. 0 means no anchor
            has been set yet (first enable, or just reset); the next poll anchors
            on the library as it is then and submits no albums.
        last_poll_at:
          type: string
          format: date-time
          description: When a poll last actually ran; absent if it has never polled.
        last_error:
          type: string
          description: >-
            Failure reason of the most recent poll; absent on success. When the
            monitor is enabled but amdl has no media-user-token (none from the
            wrapper, and catalog.media_user_token empty), this explains why it is
            idling.
        last_submitted:
          type: integer
          description: Number of albums enqueued in the most recent poll.
        total_submitted:
          type: integer
          description: Total number of albums enqueued since this process started (reset to zero on restart).
    LibrarySyncResetResponse:
      type: object
      required: [cleared, status]
      properties:
        cleared:
          type: integer
          description: Number of anchor entries cleared.
        status:
          $ref: '#/components/schemas/LibrarySyncStatus'
    ConfigResponse:
      type: object
      required: [config, persisted]
      properties:
        config:
          $ref: '#/components/schemas/RuntimeConfig'
        persisted:
          type: boolean
          description: >-
            Whether the configuration store has a persisted file. Always true in a
            normal deployment: changes made through PUT are written back to
            configs/config.yaml and still apply after a restart.
        reload_error:
          type: string
          description: >-
            Present only in the answer to POST /api/v1/config/reload when the
            configuration file could not be used (unreadable or failing
            validation); config is then the previous, still active
            configuration.
    SubmitResult:
      type: object
      required: [url, status]
      properties:
        url:
          type: string
          description: A single input URL after splitting and normalization.
        status:
          type: string
          enum: [accepted, invalid, duplicate_in_request, duplicate_active, queue_full, error]
          description: >-
            accepted: a job was created. invalid: the URL will not be accepted as
            it is (error.code says why). duplicate_in_request: an earlier URL in
            the same request names the same download. duplicate_active: a queued
            or running job already downloads it. queue_full: the job queue is
            full; retry later. error: the server failed while handling the URL
            (store_error); the same submit may succeed when retried.
        job:
          $ref: '#/components/schemas/Job'
          description: The newly created job, returned when status is accepted.
        existing_job_id:
          type: string
          description: When status is duplicate_active, points to the job with the same content that is already in progress (absent when the store's uniqueness check caught a concurrent submit).
        error:
          $ref: '#/components/schemas/SubmitError'
    SubmitError:
      type: object
      description: Why one URL was not accepted; present for every status except accepted.
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/SubmitErrorCode'
        message:
          type: string
          description: Human-readable explanation; may change between releases.
        details:
          type: object
          description: >-
            unsupported_storefront: {"storefront": "jp", "supported_storefronts":
            ["us"]}, the storefronts the wrapper's account serves.
          properties:
            storefront:
              type: string
            supported_storefronts:
              type: array
              items:
                type: string
    SubmitErrorCode:
      type: string
      description: |
        Stable per-URL code. With status invalid: invalid_url (not an Apple
        Music URL the backend can parse), unsupported_input (a link type the
        backend does not download, such as music videos),
        unsupported_storefront (the wrapper's account does not serve the URL's
        storefront), decryptor_unavailable (the wrapper is not ready; retrying
        later may succeed), invalid_configuration (the runtime configuration
        cannot parse this link). With the status of the same name:
        duplicate_in_request, duplicate_active, queue_full. With status error:
        store_error, internal_error (the validator failed unexpectedly).
      enum:
        - invalid_url
        - invalid_configuration
        - unsupported_input
        - unsupported_storefront
        - decryptor_unavailable
        - duplicate_in_request
        - duplicate_active
        - queue_full
        - store_error
        - internal_error
    BatchSubmitResponse:
      type: object
      required: [accepted, rejected, results]
      properties:
        accepted:
          type: integer
          description: Number of URLs enqueued successfully.
        rejected:
          type: integer
          description: Number of URLs rejected.
        results:
          type: array
          description: Per-URL results, one for each URL in the request.
          items:
            $ref: '#/components/schemas/SubmitResult'
    QualityRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          example: https://music.apple.com/cn/album/one-last-kiss/1542953969
    QualitySong:
      type: object
      required: [id, name, artist, album, has_lyrics]
      properties:
        id: {type: string}
        name: {type: string}
        artist: {type: string}
        album: {type: string}
        has_lyrics:
          type: boolean
          description: >-
            Whether the Apple Music catalog reports lyrics for this track
            (regular or time-synced). Catalog metadata only — it does not
            guarantee the lyrics can actually be fetched at download time.
    QualityOption:
      type: object
      required: [id, label, available]
      properties:
        id:
          type: string
          enum: [aac, aac-binaural, aac-downmix, alac, ec3, ac3]
        label: {type: string}
        available:
          type: boolean
          description: Whether the master playlist declares a variant that fits the current codec and ALAC limits; it does not mean a specific media playlist or the media segments have been verified.
        codec: {type: string}
        codec_id: {type: string}
        channels: {type: integer}
        bit_depth: {type: integer}
        sample_rate:
          type: integer
          description: Hz.
        bitrate:
          type: integer
          description: bits per second.
        description: {type: string}
    QualityTrack:
      type: object
      required: [song, qualities]
      properties:
        song:
          $ref: '#/components/schemas/QualitySong'
        qualities:
          type: array
          description: Every quality slot in the backend's fixed codec order, including entries with available=false.
          minItems: 6
          maxItems: 6
          items:
            $ref: '#/components/schemas/QualityOption'
    QualityResponse:
      type: object
      description: Per-track quality response shape shared by every supported Apple Music URL type.
      required: [input, storefront, type, adam_id, tracks]
      properties:
        input: {type: string}
        storefront: {type: string}
        type:
          type: string
          enum: [song, album, playlist, artist, station]
        adam_id:
          type: string
          description: Parsed Adam ID of the input song or collection.
        tracks:
          type: array
          description: >-
            Per-track results for every supported input type. Song inputs have
            exactly one item; collection order and duplicate song occurrences
            are preserved.
          minItems: 1
          items:
            $ref: '#/components/schemas/QualityTrack'
    LookupRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          description: One Apple Music link; surrounding whitespace is ignored.
          example: https://music.apple.com/us/album/igor/1463409338
    LookupLink:
      type: object
      description: >-
        A link as a submission would parse it. type and id are what a download
        job of this link would be.
      required: [input, type, storefront, id]
      properties:
        input:
          type: string
          description: The url as sent, trimmed.
        type:
          type: string
          enum: [song, album, playlist, artist, station, music-video]
          description: music-video only appears in details.link; the backend does not download music videos.
        storefront:
          type: string
          description: Two-letter storefront from the link path.
        id:
          type: string
          description: Catalog id of the song, album, playlist, artist or station.
        track_id:
          type: string
          description: >-
            The i parameter of an album link, present whatever
            catalog.album_track_url_mode decided: with song it equals id
            (type song); with album the job downloads the whole album (type
            album) and this names the track the link pointed at.
    LookupResponse:
      description: >-
        The parsed link plus the catalog metadata a job row shows once it
        resolves. The metadata fields have the names and meaning of the Job
        fields of the same name; each is absent when the catalog has no value or
        the link type has none.
      allOf:
        - $ref: '#/components/schemas/LookupLink'
        - type: object
          required: [title]
          properties:
            type:
              type: string
              enum: [song, album, playlist, artist, station]
            title:
              type: string
              description: Song, album, playlist, station or artist name.
            artist_name:
              type: string
              description: Song or album artist; for an artist link the artist's own name. Absent for playlists and stations.
            artist_url:
              type: string
              description: That artist's own music.apple.com page, when the catalog reports one. Absent for playlists and stations.
            curator_name:
              type: string
              description: >-
                Playlist curator (curatorName, falling back to artistName), or
                "Apple Music Station" for a station. Absent for other types.
            album_name:
              type: string
              description: The album a song belongs to. Song links only.
            artwork_url:
              type: string
              description: >-
                Artwork URL template with {w}x{h} (and optionally {f})
                placeholders, as on Job. A song without its own artwork uses its
                album's. A private playlist may expose the owner's pre-signed
                artwork URL verbatim, without placeholders.
            artwork_bg_color:
              type: string
              description: Background color of that artwork, hex without "#".
            artwork_text_color1: {type: string}
            artwork_text_color2: {type: string}
            artwork_text_color3: {type: string}
            artwork_text_color4: {type: string}
            release_date:
              type: string
              description: Release date (YYYY-MM-DD) of the song or album.
            genre:
              type: string
              description: >-
                First genreNames entry that is not the "Music" umbrella genre;
                for songs, albums and artists.
            track_count:
              type: integer
              description: >-
                Songs a download of this link would contain: 1 for a song, the
                album's or playlist's song count (music videos excluded). Absent
                for artists and stations, whose track lists are not read.
            duration_ms:
              type: integer
              description: Song duration in milliseconds. Song links only.
            content_rating:
              type: string
              enum: [explicit, clean]
              description: The catalog's content rating of a song or album; absent when unrated.
            apple_digital_master:
              type: boolean
              description: >-
                True when the catalog marks the song (isAppleDigitalMaster) or
                album (isMasteredForItunes) as an Apple Digital Master; absent
                otherwise.
            audio_traits:
              $ref: '#/components/schemas/AudioTraits'
            needs_media_user_token:
              type: boolean
              description: >-
                True for a station: its download reads the next-tracks feed,
                which needs a media-user-token (the wrapper's or
                catalog.media_user_token). Absent for other types.
    SearchResponse:
      type: object
      required: [term, storefront]
      description: >-
        One group per requested type; a type that was not requested is absent.
      properties:
        term:
          type: string
          description: The term as searched, white space collapsed.
        storefront:
          type: string
          description: The storefront searched, lowercase.
        songs:
          $ref: '#/components/schemas/SearchSongGroup'
        albums:
          $ref: '#/components/schemas/SearchAlbumGroup'
        playlists:
          $ref: '#/components/schemas/SearchPlaylistGroup'
        artists:
          $ref: '#/components/schemas/SearchArtistGroup'
    SearchSongGroup:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchSong'
          description: The page's hits; empty when there are none.
        next_offset:
          type: integer
          description: The offset of the next page; absent on the last page.
    SearchAlbumGroup:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchAlbum'
          description: The page's hits; empty when there are none.
        next_offset:
          type: integer
          description: The offset of the next page; absent on the last page.
    SearchPlaylistGroup:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchPlaylist'
          description: The page's hits; empty when there are none.
        next_offset:
          type: integer
          description: The offset of the next page; absent on the last page.
    SearchArtistGroup:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchArtist'
          description: The page's hits; empty when there are none.
        next_offset:
          type: integer
          description: The offset of the next page; absent on the last page.
    SearchHit:
      type: object
      required: [id, type, name, url]
      description: >-
        What every hit has. The metadata fields have the names and meaning of
        the LookupResponse fields of the same name; each is absent when the
        catalog has no value.
      properties:
        id:
          type: string
          description: Apple Music catalog id.
        type:
          type: string
          enum: [song, album, playlist, artist]
        name:
          type: string
        url:
          type: string
          description: >-
            A music.apple.com link that downloads exactly this item when
            submitted: a song's is a /song/ link, which
            catalog.album_track_url_mode cannot read as the whole album; an
            album's, playlist's or artist's is Apple's page without its query.
        artwork_url:
          type: string
          description: Artwork URL template with {w}x{h} placeholders, as on Job.
        artwork_bg_color:
          type: string
          description: Background color of that artwork, hex without "#".
        artwork_text_color1: {type: string}
        artwork_text_color2: {type: string}
        artwork_text_color3: {type: string}
        artwork_text_color4: {type: string}
        genre:
          type: string
          description: First genreNames entry that is not the "Music" umbrella genre.
        prior_job:
          $ref: '#/components/schemas/PriorJob'
    SearchSong:
      allOf:
        - $ref: '#/components/schemas/SearchHit'
        - type: object
          properties:
            type:
              type: string
              const: song
            artist_name: {type: string}
            album_name: {type: string}
            release_date:
              type: string
              description: YYYY-MM-DD.
            duration_ms:
              type: integer
            content_rating:
              type: string
              enum: [explicit, clean]
              description: Absent when unrated.
            apple_digital_master:
              type: boolean
              description: True when the catalog marks the song isAppleDigitalMaster; absent otherwise.
            audio_traits:
              $ref: '#/components/schemas/AudioTraits'
    SearchAlbum:
      allOf:
        - $ref: '#/components/schemas/SearchHit'
        - type: object
          properties:
            type:
              type: string
              const: album
            artist_name: {type: string}
            release_date:
              type: string
              description: YYYY-MM-DD.
            track_count:
              type: integer
              description: The release's track count as the catalog states it.
            content_rating:
              type: string
              enum: [explicit, clean]
              description: Absent when unrated.
            apple_digital_master:
              type: boolean
              description: True when the catalog marks the album isMasteredForItunes; absent otherwise.
            audio_traits:
              $ref: '#/components/schemas/AudioTraits'
    SearchPlaylist:
      allOf:
        - $ref: '#/components/schemas/SearchHit'
        - type: object
          properties:
            type:
              type: string
              const: playlist
            artist_name:
              type: string
              description: The playlist's curator.
            audio_traits:
              $ref: '#/components/schemas/AudioTraits'
    SearchArtist:
      allOf:
        - $ref: '#/components/schemas/SearchHit'
        - type: object
          properties:
            type:
              type: string
              const: artist
    AudioTraits:
      type: array
      items:
        type: string
      description: >-
        Apple's audioTraits of the song, album or playlist, as sent: values
        seen include lossless, hi-res-lossless, lossy-stereo, atmos and
        spatial. A hint of what the catalog offers; POST /api/v1/quality reads what a download
        gets. Absent when the catalog sends none.
    PriorJob:
      type: object
      required: [id, status]
      description: >-
        The job that put the hit in the library or holds it in the queue: the
        newest queued or running job of the same type and id, else the newest
        completed one, from a link in any storefront. A song downloaded as part
        of an album or playlist job is not marked; failed and cancelled jobs
        mark nothing.
      properties:
        id:
          type: string
          description: The job's id (GET /api/v1/downloads/{job_id}).
        status:
          type: string
          enum: [queued, running, completed]
        finished_at:
          type: string
          format: date-time
          description: When a completed job finished; absent for a queued or running one.
    ArtistAlbumsResponse:
      type: object
      required: [storefront, artist, albums]
      properties:
        storefront:
          type: string
          description: The storefront read, lowercase.
        artist:
          $ref: '#/components/schemas/SearchArtist'
        albums:
          $ref: '#/components/schemas/SearchAlbumGroup'
    AlbumResponse:
      type: object
      required: [storefront, id, url, title, track_count, tracks]
      description: >-
        An album's metadata and its songs. The metadata fields have the names and
        meaning of the LookupResponse fields of the same name; each is absent when
        the catalog has no value.
      properties:
        storefront:
          type: string
          description: The storefront read, lowercase.
        id:
          type: string
          description: Apple Music catalog id.
        url:
          type: string
          description: >-
            A music.apple.com link that downloads the whole album when submitted:
            Apple's page without its query, or one built from the id.
        title:
          type: string
        artist_name: {type: string}
        artist_url:
          type: string
          description: The artist's own music.apple.com page, when the catalog reports one.
        artwork_url:
          type: string
          description: Artwork URL template with {w}x{h} placeholders, as on Job.
        artwork_bg_color:
          type: string
          description: Background color of that artwork, hex without "#".
        artwork_text_color1: {type: string}
        artwork_text_color2: {type: string}
        artwork_text_color3: {type: string}
        artwork_text_color4: {type: string}
        release_date:
          type: string
          description: YYYY-MM-DD.
        genre:
          type: string
          description: First genreNames entry that is not the "Music" umbrella genre.
        track_count:
          type: integer
          description: The number of entries in tracks, as on LookupResponse (music videos excluded).
        disc_count:
          type: integer
          description: The highest disc_number among the songs; absent when the album has none.
        content_rating:
          type: string
          enum: [explicit, clean]
          description: Absent when unrated.
        apple_digital_master:
          type: boolean
          description: True when the catalog marks the album isMasteredForItunes; absent otherwise.
        audio_traits:
          $ref: '#/components/schemas/AudioTraits'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/AlbumTrack'
          description: The album's songs, sorted by disc_number, then track_number; empty when it has none.
    AlbumTrack:
      type: object
      required: [id, url, disc_number, track_number, name]
      description: >-
        One song of an album. The metadata fields have the names and meaning of
        the SearchSong fields of the same name; each is absent when the catalog
        has no value.
      properties:
        id:
          type: string
          description: Apple Music catalog id of the song, the adam_id of its job item.
        url:
          type: string
          description: A /song/ link that downloads exactly this song when submitted, as on a song search hit.
        disc_number:
          type: integer
          minimum: 1
          description: The disc the song is on; 1 when the catalog sends none.
        track_number:
          type: integer
          description: The song's position on its disc; 0 when the catalog sends none.
        name:
          type: string
        artist_name: {type: string}
        duration_ms:
          type: integer
        content_rating:
          type: string
          enum: [explicit, clean]
          description: Absent when unrated.
        apple_digital_master:
          type: boolean
          description: True when the catalog marks the song isAppleDigitalMaster; absent otherwise.
        audio_traits:
          $ref: '#/components/schemas/AudioTraits'
        has_lyrics:
          type: boolean
          description: True when the catalog reports lyrics for the song (regular or time-synced); absent otherwise.
    Job:
      type: object
      required: [id, input, type, status, total_items, completed_items, skipped_items, failed_items, cancelled_items, created_at, updated_at]
      properties:
        id:
          type: string
        input:
          type: string
        type:
          type: string
          enum: [song, album, playlist, artist, station]
        storefront:
          type: string
        title:
          type: string
          description: >-
            Display name resolved from Apple Music metadata (track/album/
            playlist/artist name). Populated once the job's input is
            resolved; absent before that or for jobs created before this
            field existed — clients should fall back to deriving a name
            from `input` in that case.
        artwork_url:
          type: string
          description: >-
            Cover artwork URL template with {w}x{h} (and optionally {f})
            placeholders; substitute the desired pixel size client-side,
            e.g. 600x600. A private playlist may instead expose the owner's
            pre-signed S3 artwork URL verbatim; that URL can expire and has no
            placeholders. Populated once the job's input is resolved; absent
            for jobs created before this field existed.
        artist_name:
          type: string
          description: >-
            Display artist resolved from Apple Music metadata: the album's or
            song's artist name, or for artist jobs the artist's own name.
            Absent for playlist/station jobs, before the input is resolved,
            or for jobs resolved before this field existed.
        artist_url:
          type: string
          description: >-
            That artist's own page on music.apple.com, read from the artist
            resource Apple includes with the resolved collection
            (attributes.url). A client linking the artist should use this
            rather than searching `artist_name`. Present alongside
            `artist_name` for song/album/artist jobs; absent for
            playlist/station jobs (their display name is a curator, not an
            artist), before the input is resolved, for jobs resolved before
            this field existed, and in the rare case where the catalog
            response carries no artist relationship.
        curator_name:
          type: string
          description: >-
            Display curator resolved from Apple Music metadata: the playlist's
            curatorName (falling back to its artistName), or the station's
            provider label. Absent for song/album/artist jobs, before the
            input is resolved, or for jobs resolved before this field existed.
        release_date:
          type: string
          description: >-
            Release date (YYYY-MM-DD) of the album or song. Absent for other
            job types, before the input is resolved, or for jobs resolved
            before this field existed.
        genre:
          type: string
          description: >-
            Primary genre of the album or song — the first Apple Music
            genreNames entry that is not the generic "Music" umbrella genre.
            Absent for other job types, before the input is resolved, or for
            jobs resolved before this field existed.
        artwork_bg_color:
          type: string
          description: >-
            Background color of the resolved collection artwork, from Apple
            Music's attributes.artwork bgColor: a hex string without a
            leading "#" (e.g. "1a1a1a"). Absent before the input is resolved,
            when the catalog omits the palette, or for jobs resolved before
            this field existed.
        artwork_text_color1:
          type: string
          description: >-
            Primary text color paired with artwork_bg_color, from Apple
            Music's attributes.artwork textColor1: a hex string without a
            leading "#". Absent under the same conditions as artwork_bg_color.
        artwork_text_color2:
          type: string
          description: >-
            Secondary text color paired with artwork_bg_color, from Apple
            Music's attributes.artwork textColor2: a hex string without a
            leading "#". Absent under the same conditions as artwork_bg_color.
        artwork_text_color3:
          type: string
          description: >-
            Tertiary text color paired with artwork_bg_color, from Apple
            Music's attributes.artwork textColor3: a hex string without a
            leading "#". Absent under the same conditions as artwork_bg_color.
        artwork_text_color4:
          type: string
          description: >-
            Quaternary text color paired with artwork_bg_color, from Apple
            Music's attributes.artwork textColor4: a hex string without a
            leading "#". Absent under the same conditions as artwork_bg_color.
        motion_artwork_url:
          type: string
          description: >-
            HLS master playlist for the album's animated cover (1:1), from Apple
            Music's attributes.editorialVideo motionDetailSquare. A public,
            unsigned URL that a client can hand straight to a video player.

            Only album and song jobs can have one, and only some albums do. It is
            resolved out of band after the input resolves, so a freshly started
            job reports it absent and gains it moments later, announced by a
            motion_artwork_resolved event. Treat absent as "no animated cover"
            and re-render when the job updates.

            That event is an overview milestone, so the downloads feed
            (GET /api/v1/downloads/events) both pushes it live and replays it
            from a cursor. Follow the feed rather than the per-job stream for
            this one field: short jobs commonly resolve their cover after
            reaching a terminal status, by which point the per-job stream has
            already closed.
        motion_artwork_tall_url:
          type: string
          description: >-
            The 3:4 variant of motion_artwork_url (motionDetailTall), for
            full-bleed presentations. Present and absent under the same
            conditions.
        motion_artwork_bg_color:
          type: string
          description: >-
            Background color for the 1:1 animated cover, from that variant's
            previewFrame. Hex without a leading "#".

            This is NOT artwork_bg_color. Each asset carries its own palette and
            they differ sharply — one album reports 598090 with near-black text
            for the still cover, 5c6786 with near-white text for the square loop,
            and 05104b with light text for the tall one. Apple Music pairs the
            palette with whichever asset it displays; mixing the still palette
            with a motion asset yields dark text on a dark video.
        motion_artwork_text_color1:
          type: string
          description: Primary text color paired with motion_artwork_bg_color.
        motion_artwork_text_color2:
          type: string
          description: Secondary text color paired with motion_artwork_bg_color.
        motion_artwork_text_color3:
          type: string
          description: Tertiary text color paired with motion_artwork_bg_color.
        motion_artwork_text_color4:
          type: string
          description: Quaternary text color paired with motion_artwork_bg_color.
        motion_artwork_tall_bg_color:
          type: string
          description: >-
            Background color for the 3:4 animated cover, from the tall variant's
            previewFrame. Use this one when presenting motion_artwork_tall_url.
        motion_artwork_tall_text_color1:
          type: string
          description: Primary text color paired with motion_artwork_tall_bg_color.
        motion_artwork_tall_text_color2:
          type: string
          description: Secondary text color paired with motion_artwork_tall_bg_color.
        motion_artwork_tall_text_color3:
          type: string
          description: Tertiary text color paired with motion_artwork_tall_bg_color.
        motion_artwork_tall_text_color4:
          type: string
          description: Quaternary text color paired with motion_artwork_tall_bg_color.
        overrides:
          $ref: '#/components/schemas/DownloadOverrides'
          description: >-
            The configuration overrides submitted with the job; omitted when none
            were given.
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        total_items:
          type: integer
          minimum: 0
          description: >-
            Number of tracks the input resolved to; 0 until the input resolves.
        completed_items:
          type: integer
          minimum: 0
          description: >-
            Items this job wrote to disk (item status completed). The four item
            counters are disjoint and derived from the job's items on every
            read, so they always agree with the items of GET /downloads/{job_id}.
        skipped_items:
          type: integer
          minimum: 0
          description: Items whose output file already existed (item status skipped_existing).
        failed_items:
          type: integer
          minimum: 0
          description: Items that failed (item status failed).
        cancelled_items:
          type: integer
          minimum: 0
          description: Items that were cancelled (item status cancelled).
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            The job's overall progress, the mean of its tracks' stage-weighted
            progress (what the console's album bar shows): below 1 while a track
            has not finished, 1 once the job completed. Derived from the items on
            every read, to three decimals. Present in GET /downloads, GET
            /downloads/{job_id} and the overview feed's snapshots; event payloads
            leave it out.
        error:
          type: string
        started_at:
          type: string
          format: date-time
          description: >-
            When a worker first started the current run; kept across recovery
            after a restart. A retry starts a new run and clears it. Absent
            until the run starts (a job cancelled while queued never has one).
        finished_at:
          type: string
          format: date-time
          description: >-
            When the job reached its current terminal status. Absent while the
            job is queued or running; a retry clears it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ItemProgress:
      type: object
      description: >-
        Per-stage breakdown of one item's download pipeline. Replaces the single
        0..1 `progress` aggregate that used to span every stage on one axis:
        download and decrypt shared sub-ranges of it, and the atomic stages were
        only fixed points — 0.97 never meant "97% tagged", just "tagging
        started".

        The two stages that genuinely have a fraction get their own meter; every
        other stage is a done/not-done flag. There is deliberately no overall
        percentage: any single number would have to re-impose the arbitrary
        weighting this object exists to remove. A client that wants one bar
        should weight these fields to suit its own UI.

        All fields are always present. The zero value means nothing has run yet,
        which is what a queued item reports. Use `status`, not this object, to
        decide whether an item is finished — a `skipped_existing` item reports
        `resolved` true (the catalog lookup is what produced the path found to
        already exist) with every later stage false, because the file was
        already on disk and nothing downloaded, decrypted, or wrote it.

        A codec fallback or retry resets the breakdown to `resolved` only, so
        the meters and flags always describe the attempt currently in flight,
        never one that already failed.
      required: [download, decrypt, download_bytes, resolved, remuxed, verified, tagged, saved]
      properties:
        download:
          type: number
          format: double
          description: >-
            Fraction in [0,1] of the encrypted media transferred. Stays at 0
            while the transfer cannot be measured (a media response without a
            Content-Length never yields a fraction), so 0 alongside
            status=downloading means "running, size unknown", not "no bytes
            yet". Pinned to 1 when the item completes.
        download_bytes:
          type: integer
          format: int64
          description: >-
            Bytes of the encrypted media the current attempt has received, the
            amount `download` is the share of. It moves together with
            `download`, so it is as coarse (whole-percent steps) and is 0 in the
            same cases: before the transfer starts and while it cannot be
            measured. Unlike `download` it is not pinned when the item
            completes; the final size is the item's `file_size`. A client adds
            it to the `file_size` of the finished items for the bytes a job has
            moved so far.
        decrypt:
          type: number
          format: double
          description: >-
            Fraction in [0,1] of the encrypted bytes fed through the decryptor.
            The aac-lc path decrypts in one opaque pass with no intermediate
            count, so there it jumps 0 → 1 at the remux boundary instead of
            sweeping. Pinned to 1 when the item completes.
        resolved:
          type: boolean
          description: Catalog metadata for the track was fetched.
        remuxed:
          type: boolean
          description: >-
            The decrypted stream was flattened into a progressive MP4.
        verified:
          type: boolean
          description: >-
            The integrity check ran and passed (for ALAC, possibly after a
            successful repair). Also false when the check is switched off by
            the `download.check_integrity` config key, so false means "not
            verified", never "corrupt" — a failed check fails the whole item
            instead. This is the one flag a completed item may legitimately
            leave false.
        tagged:
          type: boolean
          description: >-
            Metadata — and cover art / lyrics, per config — was written into
            the file.
        saved:
          type: boolean
          description: >-
            The finished file was moved to its final output path. This is the
            last step of the pipeline, so `saved` is true for exactly those
            items that reached status=completed.
    JobItem:
      type: object
      required: [id, job_id, adam_id, kind, index, has_lyrics, status, progress, created_at, updated_at]
      properties:
        id: {type: string}
        job_id: {type: string}
        adam_id: {type: string}
        kind: {type: string}
        index: {type: integer}
        title: {type: string}
        artist: {type: string}
        album: {type: string}
        duration_ms:
          type: integer
          description: >-
            Track playback duration in milliseconds, resolved from the Apple
            Music catalog alongside title/artist/album (available before the
            download runs). 0/absent for items created before this field
            existed or when the catalog omits it; a retry keeps it.
        artwork_url:
          type: string
          description: >-
            Track cover artwork URL template with {w}x{h} (and optionally {f})
            placeholders; substitute the desired pixel size client-side,
            e.g. 600x600. Absent for items created before this field existed.
        has_lyrics:
          type: boolean
          description: >-
            Whether the Apple Music catalog reports lyrics for this track
            (regular or time-synced). Set when the collection resolves and
            refreshed when the track's own metadata is fetched. Catalog
            metadata only — it does not guarantee the lyrics can actually
            be fetched at download time. Defaults to false for items
            created before this field existed, until the item is next
            re-processed (e.g. by a retry).
        lyrics_status:
          type: string
          enum: [fetched, failed, none, disabled]
          description: >-
            Durable outcome of this download attempt's lyrics fetch,
            complementing has_lyrics (the catalog's claim) with what
            actually happened. `fetched`: lyrics were fetched and
            converted successfully (the download that follows embeds
            and/or saves them per the config — the flag reflects the
            fetch outcome only; whether the file was produced is the
            item's own status); `failed`: the catalog reported lyrics but
            fetching or converting them failed and the download continued
            without lyrics; `none`: the catalog reports no lyrics for
            this track; `disabled`: lyrics exist but embed_lyrics is off
            and lyrics_files is empty. Absent while undetermined
            (item not yet processed, or created before this field
            existed) and cleared when a retry re-processes the item.
            Normally absent on skipped_existing items too: a track whose
            file is already on disk is skipped before lyrics are fetched,
            unless an earlier codec of the same track fetched them before
            a later codec's file was found on disk. On
            completed items the value keeps describing the download that
            produced the file on disk, while has_lyrics may be refreshed by a later re-resolve —
            e.g. has_lyrics=true with lyrics_status=none means the file
            predates lyrics becoming available in the catalog.
        status:
          type: string
          description: >-
            Current pipeline state. `waiting_download` and `waiting_decrypt`
            mean the item is queued at the corresponding global concurrency
            pool, and `waiting_decrypt` also covers waiting for the track's
            decryption keys; `downloading` and `decrypting` begin only after
            that pool has admitted the item.
          enum: [queued, resolving, waiting_download, downloading, waiting_decrypt, decrypting, remuxing, tagging, saving, completed, failed, skipped_existing, cancelled]
        progress:
          $ref: '#/components/schemas/ItemProgress'
        codec: {type: string}
        bit_depth:
          type: integer
          description: >-
            Bit depth of the codec currently being attempted (e.g. 24 for
            ALAC lossless). 0/absent for lossy codecs (e.g. AAC/AAC-LC) and
            before the codec's quality has been resolved.
        sample_rate:
          type: integer
          description: >-
            Sample rate in Hz of the codec currently being attempted (e.g.
            96000). Taken from the HLS manifest; when the manifest names none
            (AAC variants, aac-lc) it is read from the finished file just
            before the track is tagged, so it stays 0/absent until then, and
            for good if the file declares none.
        bitrate:
          type: integer
          description: >-
            Bitrate in bits per second of the codec currently being
            attempted: the HLS variant's advertised average bandwidth, not a
            true constant bitrate, and 256000 for aac-lc, whose media
            playlist declares none. 0/absent before the codec's quality has
            been resolved.
        file_size:
          type: integer
          format: int64
          description: >-
            Size in bytes of the final output file, set once the track is
            written to disk (completed) or found already present
            (skipped_existing). 0/absent until then, and for items produced
            before this field existed or whose file could not be stat'd.
        output_path:
          type: string
          description: >-
            Absolute path of the track's file on the machine that runs the
            backend (a relative download.downloads_dir is resolved against the
            backend's working directory). Present only once the file is on disk
            (completed, skipped_existing); absent before that, for failed or
            cancelled items, and when no path was stored. The item's event
            payloads carry it under the same rule.
        retry_kind: {type: string}
        attempt: {type: integer}
        max_attempts: {type: integer}
        status_message: {type: string}
        error: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DownloadList:
      type: object
      required: [downloads, status_counts, total, limit, offset, event_cursor]
      properties:
        downloads:
          type: array
          description: >-
            Download jobs on the current page; each job's item counters are
            derived from its items at the time of the request.
          items:
            $ref: '#/components/schemas/Job'
        status_counts:
          allOf:
            - $ref: '#/components/schemas/DownloadStatusCounts'
          description: Job status counts matching the current query filters, unaffected by limit/offset.
        total:
          type: integer
          description: Total number of jobs matching the current filters (unaffected by limit/offset).
        limit:
          type: integer
          description: The page size actually used.
        offset:
          type: integer
          description: The offset actually used.
        event_cursor:
          type: integer
          format: int64
          description: >-
            The latest persisted event id globally (across all jobs; 0 when there
            are no events yet), read before the snapshot. Pass it as ?cursor= (or
            Last-Event-ID) to GET /downloads/events to receive only list changes
            after this snapshot; resuming from it never skips an event.
    DownloadStatusCounts:
      type: object
      description: >-
        Always returns all five job statuses; statuses with no matching jobs are
        0, and total is the sum of the five statuses.
      required: [queued, running, completed, failed, cancelled, total]
      properties:
        queued: {type: integer, minimum: 0}
        running: {type: integer, minimum: 0}
        completed: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        cancelled: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
    DownloadFeedMessage:
      type: object
      required: [type, status_counts]
      description: >-
        One push on the overview event stream (GET /downloads/events). Every
        job creation, status change or deletion carries the latest global job
        status counts.
      properties:
        type:
          type: string
          enum: [download_upserted, download_deleted]
          description: >-
            download_upserted: a job was created or changed, and job is its latest
            snapshot; download_deleted: a job was deleted, and job_id is the
            deleted job's id.
        job:
          $ref: '#/components/schemas/Job'
        job_id:
          type: string
          description: Present only for download_deleted; the id of the deleted job.
        status_counts:
          allOf:
            - $ref: '#/components/schemas/DownloadStatusCounts'
          description: >-
            Status counts of all current jobs; the live push endpoints have no list
            filter parameters, so these are always global counts. In
            download_deleted the deleted job has already been subtracted.
        event_id:
          type: integer
          format: int64
          description: >-
            Resume cursor. For download_upserted it is the id of the milestone
            event that triggered this job snapshot; for download_deleted it is the
            id of the deletion tombstone event, or of the job's latest event when
            the job no longer exists (neither is the largest id pushed in the same
            batch). After processing, clients use it as the next resume
            point; it strictly increases from message to message. On reconnect,
            undelivered updates are only ever resent (upsert and delete are both
            idempotent), never skipped.
    DownloadDetail:
      type: object
      required: [job, items, hooks, event_cursor]
      properties:
        job:
          $ref: '#/components/schemas/Job'
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobItem'
        hooks:
          type: array
          description: >-
            The latest state of each post-download hook that has fired, derived
            from the hook_started/hook_succeeded/hook_failed events in the event
            stream — the snapshot endpoint and the SSE event stream are two ways
            to read the same state. An empty array when the job has not fired any
            hook yet (including when no hook is configured or the job has not
            finished).
          items:
            $ref: '#/components/schemas/HookState'
        event_cursor:
          type: integer
          format: int64
          description: >-
            The latest persisted event id for this job (0 when there are no events
            yet), read before the snapshot. Pass it as ?cursor= (or Last-Event-ID)
            to GET /downloads/{job_id}/events to skip the events already reflected
            in this response and receive only later updates.
    EventType:
      type: string
      description: >-
        Type of a persisted job event, and the SSE event name on
        GET /downloads/{job_id}/events. Retries inside a codec attempt are
        operation_retry / operation_exhausted / operation_recovered with the codec
        as phase. Only job_queued, job_recovered, job_retried, job_started,
        resolved_input, motion_artwork_resolved, item_completed, item_skipped,
        item_failed, job_finished, job_failed, job_cancelled and job_deleted
        reach the overview feed. Clients should ignore types they do not know.
      enum:
        - job_queued
        - job_started
        - job_retried
        - job_recovered
        - job_finished
        - job_failed
        - job_cancelled
        - job_deleted
        - resolved_input
        - motion_artwork_resolved
        - standalone_cover_failed
        - item_progress
        - item_completed
        - item_failed
        - item_skipped
        - item_overwrite
        - codec_selected
        - codec_fallback
        - codec_failed
        - alac_repaired
        - operation_retry
        - operation_exhausted
        - operation_recovered
        - hook_started
        - hook_succeeded
        - hook_failed
    Event:
      type: object
      required: [id, job_id, type, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: Resume cursor (SSE id); strictly increasing across all jobs.
        job_id:
          type: string
        item_id:
          type: string
          description: Present on events about one item.
        type:
          $ref: '#/components/schemas/EventType'
        phase:
          type: string
          description: >-
            item_progress: the item status. codec_* and operation_* events: the
            codec, or the operation (resolve_tracks, metadata, cover, lyrics,
            download, decrypt) when no codec applies. hook_*: the hook name.
            standalone_cover_failed for a playlist cover: playlist_cover.
        message:
          type: string
          description: Human-readable summary; its wording may change between releases.
        payload:
          type: object
          additionalProperties: true
          description: >-
            A JSON object, absent when the event has none. Job lifecycle events
            and resolved_input: the public Job snapshot plus message. Events
            with an item_id: the public JobItem snapshot plus event-specific
            fields (for example attempts, will_retry, delay_ms, codec), except
            alac_repaired, which carries only patched_packets. operation_*
            without an item_id: operation, codec, attempt, max_attempts and the
            retry fields. hook_*: hook plus attempt and duration_ms, or attempts.
            Any other event with a message: {message}. job_deleted and
            motion_artwork_resolved have none.
        created_at:
          type: string
          format: date-time
    HookState:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: The name of this hook entry in hooks.yaml.
        status:
          type: string
          enum: [running, succeeded, failed, interrupted]
          description: >-
            running: the hook is executing; succeeded: it ran successfully; failed:
            it still failed after its retries were exhausted; interrupted: the event
            records show the hook started but have no terminal record, and it is
            not running now either (usually the service restarted while it ran, so
            this hook will never produce a result).
        error:
          type: string
          description: The last error message when status is failed; omitted for other statuses.
